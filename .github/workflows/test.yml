name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node engine.test.js
      - run: node boot.test.js
      - run: node build.test.js
      - run: node store-assets.test.js
